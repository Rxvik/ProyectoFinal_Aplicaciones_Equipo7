<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas - Papuclinica</title>
    
    <link rel="stylesheet" href="../ASSETS/css/dashboard.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard-layout">

        <aside class="sidebar">
            
            <div class="sidebar-logo">
                <img src="../ASSETS/img/logo.svg" alt="Logo Papuclinica" class="papuclinica-logo-img">
                <span>Papuclinica</span>
            </div>

            <nav class="sidebar-menu">
                <ul>
                    <li>
                        <a href="paciente_dashboard.html">
                            <span>Inicio (Dashboard)</span>
                        </a>
                    </li>
                    <li>
                        <a href="paciente_agendar_cita.html">
                            <span>Agendar Cita</span>
                        </a>
                    </li>
                    <li>
                        <a href="paciente_miscitas.html" class="active">
                            <span>Mis Citas</span>
                        </a>
                    </li>
                    <li>
                        <a href="paciente_perfil.html">
                            <span>Mi Perfil</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-logout">
                <a href="login.html" id="logout-btn">
                    <span>Cerrar Sesion</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">

            <header class="navbar">
                <div class="navbar-search">
                    <input type="text" placeholder="Buscar...">
                </div>
                <div class="navbar-user">
                    <img src="https://via.placeholder.com/40" alt="Avatar de Paciente">
                    <span id="navbar-username">Paciente User</span>
                </div>
            </header>

            <main class="content-area">
                <h1 class="content-title">Mis Citas</h1>
                
                <div class="citas-seccion neumorph-card" style="padding: 2rem;">
                    <h2 class="section-title" style="margin-bottom: 2rem;">Citas Proximas</h2>

                    <ul class="citas-list" id="citas-proximas-list">

                    </ul>
                </div>

                <div class="citas-seccion neumorph-card" style="padding: 2rem; margin-top: 2rem;">
                    <h2 class="section-title" style="margin-bottom: 2rem;">Historial de Citas</h2>

                    <ul class="citas-list" id="historial-citas-list">
                        
                    </ul>
                </div>

            </main>
        </div>
    </div>
    <script src="../ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/paciente_app.js"></script>
</body>
</html>

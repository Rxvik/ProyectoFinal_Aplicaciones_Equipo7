<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes - Papuclinica</title>

    <link rel="stylesheet" href="../ASSETS/css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="../ASSETS/img/logo.svg" alt="Logo Papuclinica" class="papuclinica-logo-img">
                <span>Papuclinica</span>
            </div>

            <nav class="sidebar-menu">
                <ul>
                    <li>
                        <a href="admin_dashboard.html">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_citas.html">
                            <span>Gestión de Citas</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_medicos.html">
                            <span>Gestión de Médicos</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_pacientes.html" class="active">
                            <span>Gestión de Pacientes</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_reportes.html">
                            <span>Reportes</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-logout">
                <a href="login.html" id="logout-btn">
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">

            <header class="navbar">
                <div class="navbar-search">

                </div>
                <div class="navbar-user">
                    <img src="" alt="Avatar de Admin">
                    <span id="navbar-username">Admin User</span>
                </div>
            </header>

            <main class="content-area">
                <div class="content-header">
                    <h1 class="content-title">Gestión de Pacientes</h1>
                    <button class="btn-primary" id="btn-add-paciente" style="display: flex; align-items: center; gap: 8px;">
                        <img src="../ASSETS/img/plus.png" alt="icon" style="width: 16px; height: 16px; filter: brightness(0) invert(1);">
                        Agregar Paciente
                    </button>
                </div>

                <div class="neumorph-card table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Fecha Registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="pacientes-table-body">
                            <tr>
                                <td colspan="5" id="loading-message" style="text-align: center;">Cargando pacientes...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <div id="paciente-modal" class="modal">
        <div class="modal-content neumorph-card">
            <span class="close-btn">&times;</span>
            <h2>Agregar Paciente</h2>
            <form id="paciente-form" class="neumorph-form">
                <div class="form-group-neumorph">
                    <label>Nombre Completo</label>
                    <input type="text" name="nombre" class="input-neumorph" required>
                </div>
                <div class="form-group-neumorph">
                    <label>Email</label>
                    <input type="email" name="email" class="input-neumorph" required>
                </div>
                <div class="form-group-neumorph">
                    <label>Teléfono</label>
                    <input type="tel" name="telefono" class="input-neumorph">
                </div>
                <div class="form-group-neumorph">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="input-neumorph" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Guardar</button>
            </form>
        </div>
    </div>

    <script src="../ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/admin_app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Agenda - Papuclinica</title>
    
    <link rel="stylesheet" href="../ASSETS/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard-layout">

        <aside class="sidebar">
            
            <div class="sidebar-logo">
                <img src="../ASSETS/img/logo.svg" alt="Logo Papuclinica" class="papuclinica-logo-img">
                <span>Papuclinica</span>
            </div>

            <nav class="sidebar-menu">
                <ul>
                    <li>
                        <a href="medico_dashboard.html"> <span>Inicio (Dashboard)</span>
                        </a>
                    </li>
                    <li>
                        <a href="medico_agenda.html" class="active">
                            <span>Mi Agenda</span>
                        </a>
                    </li>
                    <li>
                        <a href="medico_pacientes.html"> <span>Mis Pacientes</span>
                        </a>
                    </li>
                    <li>
                        <a href="medico_horarios.html"> <span>Configurar Horarios</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-logout">
                <a href="login.html" id="logout-btn">
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">

            <header class="navbar">
                <div class="navbar-search">
                    <input type="text" placeholder="Buscar en mi agenda...">
                </div>
                <div class="navbar-user">
                    <img src="" alt="Avatar de Médico">
                    <span id="navbar-username">Dr. Alan Torres</span>
                </div>
            </header>

            <main class="content-area">
                
                <h1 class="content-title">Mi Agenda</h1>
                
                <p class="content-subtitle" style="font-size: 1.1rem; color: var(--text-color-light); margin-top: -1.5rem; margin-bottom: 2rem;">
                    Revisa las citas futuras y pendientes.
                </p>

                <div class="neumorph-card table-container">
                    <div id="calendar"></div>
                </div>

            </main>
        </div>
    </div>
    <script src="../ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/medico_app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Papuclinica</title>
    <link rel="stylesheet" href="../ASSETS/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="../ASSETS/img/logo.svg" alt="Logo Papuclinica" class="papuclinica-logo-img">
                <span>Papuclinica</span>
            </div>

            <nav class="sidebar-menu">
                <ul>
                    <li>
                        <a href="paciente_dashboard.html">
                            <span>Inicio</span>
                        </a>
                    </li>
                    <li>
                        <a href="paciente_agendar_cita.html" class="active">
                            <span>Agendar Cita</span>
                        </a>
                    </li>
                    <li>
                        <a href="paciente_miscitas.html">
                            <span>Mis Citas</span>
                        </a>
                    </li>
                    <li>
                        <a href="paciente_perfil.html">
                            <span>Mi Perfil</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-logout">
                <a href="login.html" id="logout-btn">
                    <span>Cerrar Sesion</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">

            <header class="navbar">
                <div class="navbar-search">
                    
                </div>
                <div class="navbar-user">
                    <img src="../ASSETS/img/paciente.png" alt="Avatar de Paciente">
                    <span id="navbar-username">Paciente User</span>
                </div>
            </header>

            <main class="content-area">
                <h1 class="content-title">Agenda tu Cita</h1>
                <p class="content-subtitle"
                    style="font-size: 1.1rem; color: var(--text-color-light); margin-top: -1.5rem; margin-bottom: 2rem;">
                    Sigue los pasos para encontrar un horario ideal.
                </p>

                <div class="neumorph-card" style="padding: 2.5rem; margin-bottom: 2rem;">
                    <h2 class="section-title">Paso 1: Selecciona el Médico</h2>
                    <div class="form-group-neumorph">
                        <label for="select-medico">Médico y Especialidad</label>
                        <select id="select-medico" class="input-neumorph" required>
                            <option value="" disabled selected>Cargando médicos...</option>
                        </select>
                    </div>
                </div>

                <div id="horarios-wrapper" class="neumorph-card" style="padding: 2.5rem; margin-top: 2rem;">
                    <h2 class="section-title">Paso 2: Fecha y Hora</h2>
                    <p class="section-subtitle" style="color: var(--text-color-light); margin-top: -0.5rem;">
                        Selecciona un horario disponible en el calendario.
                    </p>

                    <div id="calendar-paciente"></div>
                    
                    <input type="hidden" id="input-fecha">
                    <input type="hidden" id="input-hora">

                    <button class="btn-primary" id="confirmar-cita-btn" style="width: 100%; margin-top: 2rem;" disabled>
                        Confirmar Cita
                    </button>
                </div>
            </main>
        </div>

    </div>
    <script src="../ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/paciente_app.js"></script>
</body>

</html>

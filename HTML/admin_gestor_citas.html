<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Médicos - Papuclinica</title>
    <link rel="stylesheet" href="../ASSETS/css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="../ASSETS/img/logo.svg" alt="Logo Papuclinica" class="papuclinica-logo-img">
                <span>Papuclinica</span>
            </div>

            <nav class="sidebar-menu">
                <ul>
                    <li>
                        <a href="admin_dashboard.html">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_citas.html" class="active">
                            <span>Gestión de Citas</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_medicos.html">
                            <span>Gestión de Médicos</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_pacientes.html">
                            <span>Gestión de Pacientes</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_reportes.html">
                            <span>Reportes</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-logout">
                <a href="login.html" id="logout-btn">
                    <span>Cerrar Sesión</span>
                </a>
            </div>

        </aside>

        <div class="main-wrapper">

            <header class="navbar">
                <div class="navbar-search">

                </div>
                <div class="navbar-user">
                    <img src="../ASSETS/img/admin.png" alt="Avatar de Admin">
                    <span id="navbar-username">Admin User</span>
                </div>
            </header>

            <main class="content-area">

                <div class="content-header">
                    <h1 class="content-title">Gestión de Citas</h1>
                    <button class="btn-primary" id="btn-add-cita" style="display: flex; align-items: center; gap: 8px;">
                        <img src="../ASSETS/img/plus.png" alt="icon" style="width: 16px; height: 16px; filter: brightness(0) invert(1);">
                        Agregar Cita
                    </button>
                </div>

                <div class="neumorph-card table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID Cita</th>
                                <th>Paciente</th>
                                <th>Médico (Especialidad)</th>
                                <th>Fecha y Hora</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="citas-table-body">
                            <tr>
                                <td colspan="6" id="loading-message" style="text-align: center;">Cargando citas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <div id="cita-modal" class="modal">
        <div class="modal-content neumorph-card">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Editar Cita</h2>

            <form id="cita-form" class="neumorph-form">
                <input type="hidden" id="cita-id-edit">

                <div class="form-group-neumorph" id="div-paciente-select" style="display: none;">
                    <label for="select-paciente">Paciente</label>
                    <select id="select-paciente" class="input-neumorph">
                        <option value="">Cargando pacientes...</option>
                    </select>
                </div>

                <div class="form-group-neumorph">
                    <label for="paciente-name">Paciente (Actual)</label>
                    <input type="text" id="paciente-name" class="input-neumorph" readonly>
                </div>

                <div class="form-group-neumorph">
                    <label for="medico-select">Médico</label>
                    <select id="medico-select" class="input-neumorph" required>
                        <option value="">Cargando médicos...</option>
                    </select>
                </div>

                <div class="form-group-neumorph">
                    <label for="fecha-cita">Fecha</label>
                    <input type="date" id="fecha-cita" class="input-neumorph" required>
                </div>

                <div class="form-group-neumorph">
                    <label for="hora-cita">Hora</label>
                    <input type="time" id="hora-cita" class="input-neumorph"required>
                </div>

                <div class="form-group-neumorph">
                    <label for="estado-select">Estado</label>
                    <select id="estado-select" class="input-neumorph" required>
                        <option value="pendiente">Pendiente</option>
                        <option value="confirmada">Confirmada</option>
                        <option value="completada">Completada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>

                <button type="submit" id="save-cita-btn" class="btn-primary"
                    style="margin-top: 20px; width: 100%;">Guardar Cambios</button>
            </form>
        </div>
    </div>
    </div>
    </div>
    <script src="../ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/admin_app.js"></script>
</body>

</html>

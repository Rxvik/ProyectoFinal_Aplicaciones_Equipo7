<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pacientes - Papuclinica</title>

    <link rel="stylesheet" href="../ASSETS/css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../ASSETS/img/logo.svg" alt="Logo Papuclinica" class="papuclinica-logo-img">
                <span>Papuclinica</span>
            </div>

            <nav class="sidebar-menu">
                <ul>
                    <li>
                        <a href="medico_dashboard.html">
                            <span>Inicio (Dashboard)</span>
                        </a>
                    </li>
                    <li>
                        <a href="medico_agenda.html">
                            <span>Mi Agenda</span>
                        </a>
                    </li>
                    <li>
                        <a href="medico_pacientes.html" class="active"> <span>Mis Pacientes</span>
                        </a>
                    </li>
                    <li>
                        <a href="medico_horarios.html">
                            <span>Configurar Horarios</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-logout">
                <a href="login.html" id="logout-btn">
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">

            <header class="navbar">
                <div class="navbar-search">
                    <input type="text" placeholder="Buscar paciente...">
                </div>
                <div class="navbar-user">
                    <img src="" alt="Avatar de Médico">
                    <span id="navbar-username">Dr. Alan Torres</span>
                </div>
            </header>

            <main class="content-area">

                <div class="content-header">
                    <h1 class="content-title">Pacientes atendidos.</h1>
                </div>

                <div class="neumorph-card table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Última Cita</th>
                            </tr>
                        </thead>
                        <tbody id="pacientes-table-body">
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="../ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/medico_app.js"></script>
</body>
</html>

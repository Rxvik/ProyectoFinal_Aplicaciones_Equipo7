<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Médicos - Papuclinica</title>
    
    <link rel="stylesheet" href="../ASSETS/css/dashboard.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard-layout">

        <aside class="sidebar">
            
            <div class="sidebar-logo">
                <img src="../ASSETS/img/logo.svg" alt="Logo Papuclinica" class="papuclinica-logo-img">
                <span>Papuclinica</span>
            </div>

            <nav class="sidebar-menu">
                <ul>
                    <li>
                        <a href="admin_dashboard.html">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_citas.html">
                            <span>Gestión de Citas</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_medicos.html" class="active">
                            <span>Gestión de Médicos</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_pacientes.html">
                            <span>Gestión de Pacientes</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_reportes.html">
                            <span>Reportes</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-logout">
                <a href="login.html" id="logout-btn">
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">

            <header class="navbar">
                <div class="navbar-search">
                    
                </div>
                <div class="navbar-user">
                    <img src="" alt="Avatar de Admin">
                    <span id="navbar-username">Admin User</span>
                </div>
            </header>

            <main class="content-area">
                
                <div class="content-header">
                    <h1 class="content-title">Gestión de Médicos</h1>
                    <button id="agregar-medico-btn" class="btn-primary" style="display: flex; align-items: center; gap: 8px;">
                        <img src="../ASSETS/img/plus.png" alt="icon" style="width: 16px; height: 16px; filter: brightness(0) invert(1);">
                        Agregar Médico
                    </button>
                </div>

                <div class="neumorph-card table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th> <th>Nombre</th>
                                <th>Especialidad</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="medicos-table-body">
                            <tr><td colspan="6" style="text-align: center;"><div id="loading-message" class="loading-spinner">Cargando médicos...</div></td></tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <div id="medico-modal" class="modal">
        <div class="neumorph-card modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title" style="margin-top: 0;"></h2>
            
            <form id="medico-form">
                <input type="hidden" id="medico-id-edit" name="id_medico">

                <div class="form-group-neumorph">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" class="input-neumorph" required>
                </div>

                <div class="form-group-neumorph">
                    <label for="especialidad">Especialidad:</label>
                    <input type="text" id="especialidad" name="especialidad" class="input-neumorph" required>
                </div>

                <div class="form-group-neumorph">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="input-neumorph" required>
                </div>

                <div class="form-group-neumorph">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" class="input-neumorph">
                </div>
                
                <div id="password-group" class="form-group-neumorph">
                    <label for="password">Contraseña (Obligatoria):</label>
                    <input type="password" id="password" name="password" class="input-neumorph">
                </div>
                
                <div class="form-divider"></div>

                <button type="submit" id="submit-btn" class="btn-primary" style="width: 100%;">Guardar</button>
            </form>
        </div>
    </div>

    <script src="../ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/admin_app.js"></script>
</body>
</html>

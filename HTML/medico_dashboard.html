<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Papuclinica</title>

    <link rel="stylesheet" href="../ASSETS/css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../ASSETS/img/logo.svg" alt="Logo Papuclinica" class="papuclinica-logo-img">
                <span>Papuclinica</span>
            </div>

            <nav class="sidebar-menu">
                <ul>
                    <li>
                        <a href="medico_dashboard.html" class="active">
                            <span>Inicio (Dashboard)</span>
                        </a>
                    </li>
                    <li>
                        <a href="medico_agenda.html">
                            <span>Mi Agenda</span>
                        </a>
                    </li>
                    <li>
                        <a href="medico_pacientes.html">
                            <span>Mis Pacientes</span>
                        </a>
                    </li>
                    <li>
                        <a href="medico_horarios.html">
                            <span>Configurar Horarios</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-logout">
                <a href="login.html" id="logout-btn">
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">

            <header class="navbar">
                <div class="navbar-search">
                    <input type="text" placeholder="Buscar paciente...">
                </div>
                <div class="navbar-user">
                    <img src="" alt="Avatar de Médico">
                    <span id="navbar-username">Dr. Alan Torres</span>
                </div>
            </header>

            <main class="content-area">

                <h1 class="content-title" id="medico-title"></h1>

                <div class="stats-grid">
                    <div class="stat-card neumorph-card">
                        <span class="card-icon"> <img src="../ASSETS/img/doctor.svg" alt="doctor icon"
                                class="doctor-img"> </span>
                        <h3>Próxima Cita</h3>
                        <p class="stat-number" id="proxima-cita-hora" style="font-size: 1.5rem;">Cargando...</p>
                        <span style="color: var(--text-color-light);" id="proxima-cita-paciente">Cargando...</span>
                    </div>
                    <div class="stat-card neumorph-card">
                        <span class="card-icon"> <img src="../ASSETS/img/note.svg" alt="note icon" class="note-img">
                        </span>
                        <h3>Total de Citas (Hoy)</h3>
                        <p class="stat-number" id="citas-hoy-total">0</p>
                    </div>
                    <div class="stat-card neumorph-card">
                        <span class="card-icon"> <img src="../ASSETS/img/bandage.svg" alt="bandage icon"
                                class="bandage-img"> </span>
                        <h3>Pacientes Atendidos</h3>
                        <p class="stat-number" id="pacientes-atendidos-count">0 / 0</p>
                    </div>
                </div>

                <div class="citas-seccion neumorph-card" style="padding: 2rem; margin-top: 2.5rem;">
                    <h2 class="section-title" style="margin-bottom: 2rem;">Citas de Hoy</h2>

                    <ul class="citas-list" id="citas-hoy-list">
                    </ul>
                </div>

            </main>
        </div>
    </div>
    <script src="../ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/medico_app.js"></script>
</body>
</html>

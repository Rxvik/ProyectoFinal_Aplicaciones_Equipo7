<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Papuclinica</title>
    <link rel="stylesheet" href="../ASSETS/css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="dashboard-layout">

        <aside class="sidebar">
            
            <div class="sidebar-logo">
                <img src="../ASSETS/img/logo.svg" alt="Logo Papuclinica" class="papuclinica-logo-img">
                <span>Papuclinica</span>
            </div>

            <nav class="sidebar-menu">
                <ul>
                    <li>
                        <a href="admin_dashboard.html">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_citas.html">
                            <span>Gestión de Citas</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_medicos.html">
                            <span>Gestión de Médicos</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_gestor_pacientes.html">
                            <span>Gestión de Pacientes</span>
                        </a>
                    </li>
                    <li>
                        <a href="admin_reportes.html" class="active">
                            <span>Reportes</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-logout">
                <a href="login.html" id="logout-btn">
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <div class="main-wrapper">

            <header class="navbar">
                <div class="navbar-search">
                    <input type="text" placeholder="Buscar...">
                </div>
                <div class="navbar-user">
                    <img src="" alt="Avatar de Admin">
                    <span id="navbar-username">Admin User</span>
                </div>
            </header>

            <main class="content-area">
                
                <h1 class="content-title">Generar Reportes</h1>
                
                <p class="content-subtitle" style="font-size: 1.1rem; color: var(--text-color-light); margin-top: -1.5rem; margin-bottom: 2rem;">
                    Selecciona los filtros para generar tu reporte PDF.
                </p>

                <div class="neumorph-card" style="padding: 2.5rem; max-width: 600px;">
                    
                    <form action="../api/usuarios/admin/reporte_impresion.php" method="GET" target="_blank" class="report-form">
    
                        <div class="form-group-neumorph">
                            <label for="fecha_inicio">Fecha de Inicio</label>
                            <input type="date" id="fecha_inicio" name="fecha_inicio" class="input-neumorph">
                        </div>

                        <div class="form-group-neumorph">
                            <label for="fecha_fin">Fecha de Fin</label>
                            <input type="date" id="fecha_fin" name="fecha_fin" class="input-neumorph">
                        </div>

                        <div class="form-group-neumorph">
                            <label for="medico">Médico</label>
                            <select id="medico" name="medico" class="input-neumorph">
                                <option value="todos">Todos los médicos</option>
                                 </select>
                        </div>
                        
                        <div class="form-group-neumorph">
                            <label for="estado_cita">Estado de la Cita</label>
                            <select id="estado_cita" name="estado_cita" class="input-neumorph">
                                <option value="todas">Todas (Completadas, Pendientes, Canceladas)</option>
                                <option value="completada">Solo Completadas</option>
                                <option value="pendiente">Solo Pendientes</option>
                                <option value="cancelada">Solo Canceladas</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-primary" style="margin-top: 2rem; width: 100%;">
                            Generar Reporte PDF
                        </button>
                    </form>

                </div>

            </main>
        </div>
    </div>
    <script src="../ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/admin_app.js"></script>
</body>
</html>
